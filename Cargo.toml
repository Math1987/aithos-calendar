[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
lambda_http = { version = "=1.3.1", default-features = false, features = ["apigw_http"] }
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[profile.release]
strip = true
lto = "thin"
