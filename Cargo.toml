[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
a2a-client = { package = "a2a-client-lf", version = "=0.2.5" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "=1.0.229", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
uuid = "=1.26.1"
a2a = { package = "a2a-lf", version = "=0.3.1" }
a2a-server = { package = "a2a-server-lf", version = "=0.4.4", default-features = false }
ai-catalog = "=0.2.1"
ai-catalog-trust = "=0.2.1"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
futures = "=0.3.34"
serde_json = "=1.0.151"
lambda_http = { version = "=1.3.1", default-features = false, features = ["apigw_http"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "net"] }

tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

aws-config = { version = "=1.8.13", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "=1.117.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
serde_jcs = "=0.2.0"
base64ct = { version = "=1.8.3", features = ["alloc"] }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
aws-sdk-kms = { version = "=1.120.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-secretsmanager = { version = "=1.117.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
chrono-tz = "=0.10.4"

openidconnect = { version = "=4.0.1", default-features = false }
lambda_runtime = "=1.4.0"

aws-sdk-bedrockruntime = { version = "=1.120.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "=1.94.0", default-features = false, features = ["rt-tokio", "default-https-client"] }

[dev-dependencies]
ai-catalog-validate = "=0.2.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
