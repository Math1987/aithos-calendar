[package]
name = "calendar"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
a2a-client = { package = "a2a-client-lf", version = "=0.2.5" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
uuid = "=1.26.1"
a2a = { package = "a2a-lf", version = "=0.3.1" }
a2a-server = { package = "a2a-server-lf", version = "=0.4.4", default-features = false }
ai-catalog = "=0.2.1"
async-trait = "=0.1.92"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures = "=0.3.34"
serde_json = "=1.0.151"
lambda_http = { version = "=1.3.1", default-features = false, features = ["apigw_http"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "net"] }

tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
